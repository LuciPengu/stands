# Stands — config. Damage in HP (2 HP = 1 heart). Cooldowns in seconds.
# Edit, then /stand reload. See BALANCE.md for the reasoning behind each number.

# Stands the random Stand Arrow can give. Add more here as they get ported.
enabled-stands: [theworld, starplatinum, crazydiamond, stickyfingers, kingcrimson, silverchariot, magiciansred, heirophantgreen, aerosmith, tuskact4, theemperor, weatherreport, killerqueen, thehand, purplehaze, echoesact3, metallica, hermitpurple, anubis, goldenexperience, d4c]
# 'ger' (Gold Experience Requiem) is not in the arrow pool: use a Stand Arrow with a level 3 Gold Experience.

arrow:
  fail-chance: 0.10      # chance the arrow "rejects" you
  fail-damage: 30.0      # original mod: 30 (lethal). Lower for friendlier servers.
  craftable: true

# Stands level up two ways: stand XP earned by fighting, or paying vanilla XP levels with /stand levelup.
levels:
  level-2-xp: 300        # total stand XP to reach level 2 (unlocks skill 2)
  level-3-xp: 1000       # total stand XP to reach level 3 (unlocks the ultimate)
  level-2-cost: 30       # vanilla XP levels for /stand levelup
  level-3-cost: 60

xp:
  per-damage-vs-mobs: 1.0      # stand XP per point of base ability damage
  per-damage-vs-players: 3.0
  mob-kill: 8
  player-kill: 60
  duel-win: 150
  duel-loss: 30

pvp:
  default-on: false      # new players start with stand PvP off; /stand pvp toggles it
  duel-countdown: 5      # seconds
  duel-time-limit: 180   # seconds, then it's a draw

# Block-changing powers (zippers, fire, erase): 'temporary' restores the blocks after a few seconds, 'off' = damage only.
world-edits: temporary

# Who you hit decides how stand damage works.
#  - Stand users: TRUE damage (ignores armor + Protection) so stand PvP is skill/stand-based, not gear-based.
#  - Players without a stand and mobs: big multipliers, armor applies normally. It should feel unfair.
power:
  vs-stand-users: 1.0          # x base damage, ignores armor
  vs-players-without-stand: 3.0
  vs-mobs: 4.0
  cooldown-multiplier: 0.7     # every stand's cooldowns x this (lower = spammier)

# Resource pack hosting (sounds + stand models). Players download it on join.
pack:
  enabled: true
  port: 8765
  public-url: "http://localhost:8765"   # change to your tunnel/public address for friends
  required: false

# Sound ids live here so you can swap them without touching code.
