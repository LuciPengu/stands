<!doctype html>
<html><head><meta charset="utf-8"><title>Stand Model Preview</title>
<style>
:root{--bg:#14121a;--fg:#e9e4f2}
body{margin:0;background:var(--bg);color:var(--fg);font:13px system-ui}
#grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;padding:4px}
.cell{position:relative;aspect-ratio:3/4;background:#1d1a26;border-radius:6px;overflow:hidden}
.cell span{position:absolute;left:6px;bottom:4px;opacity:.8}
canvas{width:100%;height:100%;display:block}
</style></head><body><div id="grid"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const NAMES=["starplatinum","theworld","kingcrimson","killerqueen","goldenexperience","ger","magiciansred","silverchariot","thehand","weatherreport","heirophantgreen","stickyfingers","aerosmith","tuskact4","d4c","crazydiamond","purplehaze","echoesact3"];
const yaw=parseFloat(new URLSearchParams(location.search).get('yaw')||'25');
const D=Math.PI/180;
function faceUV(geo,fi,uv,W,H){ // three BoxGeometry face order: +x,-x,+y,-y,+z,-z ; 4 verts: tl,tr,bl,br
  const a=geo.attributes.uv,[u1,v1,u2,v2]=uv,b=fi*4;
  const p=[[u1,v1],[u2,v1],[u1,v2],[u2,v2]];
  p.forEach(([u,v],i)=>a.setXY(b+i,u/W,1-v/H));
}
const ORDER=["east","west","up","down","south","north"];
async function build(name){
  const m=await (await fetch(`../models/${name}.bbmodel`)).json();
  const W=m.resolution.width,H=m.resolution.height;
  const tex=new THREE.TextureLoader().load(m.textures[0].source);
  tex.magFilter=tex.minFilter=THREE.NearestFilter;
  const mat=new THREE.MeshLambertMaterial({map:tex,transparent:true,alphaTest:.1,side:THREE.DoubleSide});
  const els=Object.fromEntries(m.elements.map(e=>[e.uuid,e]));
  const root=new THREE.Group();
  function grp(g,parentOrigin){
    const o=new THREE.Group();
    o.position.set(g.origin[0]-parentOrigin[0],g.origin[1]-parentOrigin[1],g.origin[2]-parentOrigin[2]);
    o.rotation.order='ZYX';o.rotation.set(g.rotation[0]*D,g.rotation[1]*D,g.rotation[2]*D);
    for(const c of g.children){
      if(typeof c==='string'){const e=els[c];const inf=e.inflate||0;
        const s=[0,1,2].map(i=>e.to[i]-e.from[i]+2*inf);
        const geo=new THREE.BoxGeometry(...s.map(v=>Math.max(v,0.001)));
        ORDER.forEach((f,i)=>e.faces[f]&&faceUV(geo,i,e.faces[f].uv,W,H));
        const mesh=new THREE.Mesh(geo,mat);
        mesh.position.set(...[0,1,2].map(i=>(e.from[i]+e.to[i])/2-g.origin[i]));
        o.add(mesh);
      } else o.add(grp(c,g.origin));
    }
    return o;
  }
  m.outliner.forEach(g=>root.add(grp(g,[0,0,0])));
  return root;
}
(async()=>{
  const R=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  for(const n of NAMES){
    const cell=document.createElement('div');cell.className='cell';
    const cv=document.createElement('canvas');cell.append(cv);
    const lab=document.createElement('span');lab.textContent=n;cell.append(lab);
    document.getElementById('grid').append(cell);
    cv.width=cell.clientWidth*2;cv.height=cell.clientHeight*2;
    R.setSize(cv.width,cv.height,false);
    const sc=new THREE.Scene();sc.add(new THREE.AmbientLight(0xffffff,.75));
    const dl=new THREE.DirectionalLight(0xffffff,.5);dl.position.set(10,20,30);sc.add(dl);
    const cam=new THREE.PerspectiveCamera(30,cell.clientWidth/cell.clientHeight,1,500);
    const model=await build(n);
    const box=new THREE.Box3().setFromObject(model),c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
    const dist=Math.max(sz.y,sz.x)*2.1+10;
    cam.position.set(c.x+Math.sin(yaw*D)*dist,c.y+4,c.z+Math.cos(yaw*D)*dist);cam.lookAt(c);
    sc.add(model);
    await new Promise(res=>setTimeout(res,150));
    await new Promise(res=>setTimeout(res,250));
    R.render(sc,cam); cv.getContext('2d').drawImage(R.domElement,0,0);
  }
  document.title='ready';
})();
</script></body></html>
